name: Procesar logos de clientes

# Se dispara cuando entra una imagen nueva a la carpeta de clientes. El
# resultado del procesamiento queda excluido del disparador para que el
# commit que hace este mismo flujo no se dispare a si mismo.
on:
  push:
    branches: [main]
    paths:
      - "assets/img/logo_clientes/**"
      - "!assets/img/logo_clientes/procesados/**"
      - "!assets/img/logo_clientes/logos.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logos-clientes
  cancel-in-progress: true

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet pillow numpy

      - name: Procesar logos y regenerar el carrusel
        run: python procesar_logos.py
        working-directory: assets/img/logo_clientes

      - name: Publicar si hubo cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada que publicar: los logos ya estaban al dia."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar logos de clientes procesados"
          git push
